<div class="hs-dropdown relative inline-flex [--trigger:click]">
  <button
    type="button"
    class="hs-dropdown-toggle py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none"
  >
    Language: {{ currentLanguage }}
    <svg class="hs-dropdown-open:rotate-180 w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <div class="hs-dropdown-menu z-50 mt-2 w-44 bg-white shadow-md rounded-lg border border-gray-100 hidden">
    <ul class="py-1 text-sm text-gray-700">
      @for (language of languages; track language) {
        <li>
          <button (click)="setLanguage(language)" class="w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-x-2" [class.bg-blue-50]="getLanguageCode(language) === currentLanguage">
            @if (getLanguageCode(language) === currentLanguage) {
              <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            }
            {{ language }}
          </button>
        </li>
      } @empty {
        <li>
          <span class="block px-4 py-2 text-gray-400">There are no items.</span>
        </li>
      }
    </ul>
  </div>
</div>
